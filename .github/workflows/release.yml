name: release

# Pushing vX.Y.Z (scripts/release.sh tag) builds the web UI and attaches a
# dependency-free tarball to the GitHub Release — the immutable pin next to
# the moving web-dist branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches package.json version
        run: |
          v="${GITHUB_REF_NAME#v}"
          m=$(node -p "require('./package.json').version")
          [ "$v" = "$m" ] || { echo "tag $v != manifest $m"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/pack-dist.mjs --out artifacts --pack
      - name: Checksums
        run: cd artifacts && sha256sum *.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: canvas-web ${{ github.ref_name }}
          body: >
            Prebuilt web UI for canvas-server. Dependency-free tarball
            (package.json + dist/); consume as an npm tarball-URL dependency
            and pin the exact URL.
          files: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
