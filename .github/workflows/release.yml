name: release

# On every push to main: build the web UI and, if npm does not have this
# version yet, publish @augmentd-labs/canvas-web and create the v<version>
# tag + GitHub Release (with the tarball). An unbumped push publishes nothing.
# Release = `pnpm run release patch` (bump + push).
#
# Auth is npm trusted publishing: the package on npmjs.com names this repo
# and THIS workflow file; GitHub OIDC replaces any token and provenance is
# attached. Renaming this file breaks publishing until npm is updated too.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # tag + GitHub Release
  id-token: write   # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - id: npm
        shell: bash   # -eo pipefail: a failed publish must fail the step, not just grep
        run: node scripts/publish-npm.mjs --out artifacts | tee /dev/stderr | grep '^published=' >> "$GITHUB_OUTPUT"
      - name: Tag + GitHub Release
        if: steps.npm.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.npm.outputs.published }}
        run: |
          cd artifacts && sha256sum *.tgz > SHA256SUMS
          gh release create "v$VER" --target "$GITHUB_SHA" --title "canvas-web v$VER" \
            --notes "npm: \`@augmentd-labs/canvas-web@$VER\`. Prebuilt, dependency-free web UI for canvas-server." \
            ./*.tgz SHA256SUMS
