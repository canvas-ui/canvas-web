name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version input: pnpm/action-setup reads the packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      # The web-dist artifact must stage + pack on every PR, so a broken
      # bundle fails review rather than the dist publish.
      - run: node scripts/pack-dist.mjs --out artifacts --pack
