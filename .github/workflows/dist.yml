name: dist

# Publishes the git-fetchable web-dist branch on every push to main.
# canvas-server pins "github:canvas-ui/canvas-web#web-dist" and picks a push
# up on its next `npm update canvas-web`. --if-needed skips when nothing
# shippable moved since the branch's recorded canvasRev.
#
# The one workflow that writes to the repo (web-dist only, never main).
# `pnpm run release dist` does the same from a laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # a real branch, not a detached HEAD — the script insists on main
          fetch-depth: 0     # --if-needed walks history back to the published canvasRev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Publish web-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh dist --if-needed
